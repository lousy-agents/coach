name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          diff <(gofmt -l .) <(printf '')

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: acceptance-style-check
        run: go run ./cmd/acceptance-style-guard

      - name: go test -race
        run: go test -race ./...

      - name: go test examples
        run: go test -run Example ./...

  js-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs go and node from mise.toml [tools], so CI and local builds
      # share one tool-version source of truth.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: js/semantics build + tests
        run: mise run js-ci

      # pkg/projectmodel/ts_sidecar_integration_acceptance_test.go drives
      # Task 1's Go client against Task 2's real compiled Node/TypeScript
      # sidecar; it needs Node/npm on PATH (this job has them via mise, the
      # `verify` job deliberately does not) and gracefully skips otherwise,
      # so without this step it silently contributes zero regression signal.
      - name: js/semantics install (for pkg/projectmodel's real ts sidecar integration suite)
        run: mise run js-install

      - name: build the pinned ts project sidecar
        run: mise run project-sidecar-build

      - name: go test -race ./pkg/projectmodel/... (real ts sidecar integration suite)
        run: go test -race ./pkg/projectmodel/... -run Acceptance

  # Proves pkg/semantics compiles for GOOS=js GOARCH=wasm via the pure-Go
  # gotreesitter engine, with no TinyGo.
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jdx/mise-action (not actions/setup-go) so `mise run wasm-build`
      # resolves, keeping the exact build flags (grammar-subset tags,
      # GOOS/GOARCH/CGO_ENABLED) defined once in mise.toml rather than
      # duplicated here.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: GOOS=js GOARCH=wasm build (pure-Go engine)
        run: mise run wasm-build

  # Baseline Scan Story 4 / Task 10: credential-free core-profile E2E smoke
  # (api + worker + postgres + redis + model stub). Distinct from thinproof.
  platform-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: platform-up (core)
        run: mise run platform-up

      - name: platform-smoke
        run: mise run platform-smoke

      - name: platform-down
        if: always()
        run: mise run platform-down
