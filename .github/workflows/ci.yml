name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Atomic mise tasks matching `ci-go`. Node is not installed, so
  # pkg/projectmodel's real TS sidecar suite skips here on purpose.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: go
          experimental: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: gofmt
        run: mise run gofmt

      - name: go-vet
        run: mise run go-vet

      - name: tidy-check
        run: mise run tidy-check

      - name: acceptance-style-check
        run: mise run acceptance-style-check

      - name: test
        run: mise run test

      - name: test-examples
        run: mise run test-examples

  js-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true

      - name: js-ci
        run: mise run js-ci

  # Parallel with js-verify: both need Node, neither waits on the other.
  # Required-check follow-up: add this job name if branch protection lists jobs.
  projectmodel-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: projectmodel-sidecar-acceptance
        run: mise run projectmodel-sidecar-acceptance

  # Proves pkg/semantics compiles for GOOS=js GOARCH=wasm via the pure-Go
  # gotreesitter engine, with no TinyGo.
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: go
          experimental: true

      - name: wasm-build
        run: mise run wasm-build

  # Baseline Scan Story 4 / Task 10: credential-free core-profile E2E smoke
  # (api + worker + postgres + redis + model stub). Distinct from thinproof.
  # Three steps so platform-down still runs when up or smoke fails.
  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: go
          experimental: true

      - name: platform-up
        run: mise run platform-up

      - name: platform-smoke
        run: mise run platform-smoke

      - name: platform-down
        if: always()
        run: mise run platform-down
