name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Atomic mise tasks matching `ci-go`. This job does not install Node via
  # mise; ubuntu-latest still has a runner Node, so the sidecar suite typically
  # skips because the sidecar build fails (no npm ci), not because node is
  # absent. The real suite lives in projectmodel-sidecar.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go
          experimental: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: gofmt
        run: mise run gofmt

      - name: go-vet
        run: mise run go-vet

      - name: tidy-check
        run: mise run tidy-check

      - name: acceptance-style-check
        run: mise run acceptance-style-check

      - name: test
        run: mise run test

      - name: test-examples
        run: mise run test-examples

  js-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: js-ci
        run: mise run js-ci

  # Parallel with js-verify: both need Node, neither waits on the other.
  projectmodel-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: projectmodel-sidecar-acceptance
        run: mise run projectmodel-sidecar-acceptance

  # Proves pkg/semantics compiles for GOOS=js GOARCH=wasm via the pure-Go
  # gotreesitter engine, with no TinyGo.
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go
          experimental: true

      - name: wasm-build
        run: mise run wasm-build

  # Baseline Scan Story 4 / Task 10: credential-free core-profile E2E smoke
  # (api + worker + postgres + redis + model stub). Distinct from thinproof.
  # Three steps so platform-down still runs when up or smoke fails.
  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go
          experimental: true

      - name: platform-up
        run: mise run platform-up

      - name: platform-smoke
        run: mise run platform-smoke

      - name: platform-down
        if: always()
        run: mise run platform-down

  # Single required check for branch protection. Leaf jobs stay parallel;
  # this job fails if any required leaf is not success. if: always() so a
  # failed leaf still produces a failed status rather than a missing check.
  status:
    if: always()
    needs: [verify, js-verify, projectmodel-sidecar, wasm-build, platform-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = sorted(
              name for name, job in needs.items() if job.get("result") != "success"
          )
          if failed:
              for name in failed:
                  print(f"{name} failed: {needs[name].get('result')}")
              sys.exit(1)
          print("All required jobs passed")
          PY
