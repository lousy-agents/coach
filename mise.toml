min_version = "2026.9.0"

[settings]
experimental = true

[tools]
go = "1.27.0"
node = "24"

[tasks.gofmt]
description = "Fail if any Go file needs formatting"
run = """
files=$(gofmt -l .)
if [ -n "$files" ]; then
  printf '%s\\n' "$files"
  exit 1
fi
"""

[tasks.go-vet]
description = "Run go vet on all packages"
run = "go vet ./..."

[tasks.test]
description = "Run all unit tests with race detection"
run = "go test -race ./..."

[tasks.test-examples]
description = "Run Go example tests"
run = "go test -run Example ./..."

[tasks.acceptance-style-check]
description = "Fail if any *_acceptance_test.go lacks a ginkgo/v2 import (except the explicit allowlist)"
run = "go run ./cmd/acceptance-style-guard"

[tasks.test-acceptance-fast]
description = "Run the fast, in-process Ginkgo/Gomega acceptance suites (public Go/CLI-boundary tests, offline, no real credentials) -- Feature Zero's runnable acceptance layer (see docs/architecture/acceptance-harness.md)"
run = [
  "go run ./cmd/acceptance-guard-preflight",
  { task = "acceptance-style-check" },
  "go test -race ./... -run Acceptance",
]

[tasks.test-queue-conformance]
description = "Run the queue conformance harness's self-test (in-memory reference adapter), plus the redisstream and sqs adapters' conformance tests against real Redis Streams / LocalStack SQS containers wherever Docker is available (skips gracefully otherwise; see docs/architecture/acceptance-harness.md)"
run = [
  "go test -race ./internal/acceptanceharness/queueconformance/... -run Acceptance -v",
  "go test -race ./internal/coachapi/queue/redisstream/... -run Acceptance -v",
  "go test -race ./internal/coachapi/queue/sqs/... -run Acceptance -v",
]

[tasks.thinproof-build]
description = "Build local Docker images for issue #79's offline thin Compose proof (run once, online, before going offline)"
run = [
  "go mod vendor",
  "docker compose -f deploy/compose/thinproof/docker-compose.yml build",
]

[tasks.test-acceptance-thin-proof]
description = "Run the offline thin Compose proof: fake GitHub -> pkg/githubingest -> CodeSignal, no image pull, no egress (see docs/architecture/acceptance-harness.md section 2)"
run = [
  "go run ./cmd/acceptance-guard-preflight",
  "go run ./cmd/thinproof-preflight",
  "go test -race -tags thinproof ./internal/acceptanceharness/thinproof/... -run Acceptance -v -count=1",
]

[tasks.tidy-check]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy && git diff --exit-code go.mod go.sum"

[tasks.backend-build]
description = "Build the Go stdio backend binary consumed by js/semantics"
run = "go build -o js/semantics/bin/coach-semantics-json ./cmd/semantics-json"

[tasks.project-sidecar-build]
description = "Build the pinned Node/TypeScript project sidecar binary consumed by pkg/projectmodel (issue #214 Task 3)"
run = "npm run build:project-sidecar"
dir = "js/semantics"
# build:project-sidecar runs `tsc -p tsconfig.json` into the same dist/ that
# js-build's `npm run build` (also `tsc -p tsconfig.json`) writes to, then
# rmSync/cpSync's dist/project-sidecar. js-build is an independent sibling in
# js-ci's DAG with no edge to this task, so without this dependency mise runs
# them concurrently and the two tsc invocations can interleave writes into
# the shared dist/ tree -- this task's cpSync can then read a
# partially-rewritten file, corrupting bin/project-sidecar (and, via
# ts-analyzer-embed-sync, the checked-in embed). Depending on js-build
# (which already depends on js-install/backend-build) serializes the two
# tsc runs. Tradeoff: this also pulls js-install/backend-build/js-build into
# the projectmodel-sidecar GHA job, which previously only ran js-install.
depends = ["js-build"]

[tasks.projectmodel-sidecar-acceptance]
description = "Run the real TS sidecar integration specs (verify already ran the rest of the package)"
depends = ["project-sidecar-build"]
run = "go test -race ./pkg/projectmodel/... -run Acceptance -ginkgo.label-filter=ts-sidecar-integration -ginkgo.fail-on-empty"

[tasks.ts-project-backend-acceptance]
description = "Run cmd/coach and internal/codesignalcli's TS-dependent acceptance specs (coach#326 Task 3's remaining CI gap) against this repo's own installed js/semantics TypeScript compiler"
depends = ["js-install"]
run = "go test -race ./cmd/coach/... ./internal/codesignalcli/... -run Acceptance -ginkgo.label-filter=ts-project-backend -ginkgo.fail-on-empty"

[tasks.js-install]
description = "Install js/semantics dev dependencies (scripts skipped; js-build compiles explicitly)"
run = "npm ci --ignore-scripts"
dir = "js/semantics"

[tasks.js-build]
description = "Typecheck and compile the TS package"
run = "npm run build"
dir = "js/semantics"
depends = ["js-install", "backend-build"]

[tasks.js-test]
description = "Run js/semantics tests (fake-backend, CLI lifecycle, and Go/JS parity suites)"
run = [
  "npm run build:test",
  "node --test \"dist-test/**/*.test.js\"",
]
dir = "js/semantics"
# project-sidecar-build is also ts-analyzer-embed-sync's dependency (via
# ts-analyzer-embed-stale-check, in js-ci's depends alongside this task).
# mise runs a shared dependency once per invocation and every dependent
# waits for it, so listing it here forces that rebuild to finish before
# js-test spawns the sidecar it's currently vendoring into --
# build-project-sidecar.mjs's --clean/rmSync steps would otherwise race
# js-test's own sidecar process and delete modules out from under it.
depends = ["js-build", "project-sidecar-build"]

[tasks.workflow-test]
description = "Functional tests for .claude/workflows scripts (also the only check that they parse)"
run = "node --test \".claude/workflows/**/*.test.mjs\""

[tasks.opencode-plugin-test]
description = "Tests for the OpenCode plugin that mirrors .claude/agents and .claude/commands"
run = "node --test \".opencode/plugin/*.test.ts\""

[tasks.ts-analyzer-embed-sync]
description = "Regenerate the checked-in TypeScript analyzer embed (internal/codesignalcli/tsanalyzerasset/) from a fresh js/semantics project-sidecar build (coach#325)"
depends = ["project-sidecar-build"]
run = "node js/semantics/scripts/sync-ts-analyzer-embed.mjs"

[tasks.ts-analyzer-embed-stale-check]
description = "Fail if the checked-in TypeScript analyzer embed drifts from a fresh js/semantics build -- the tidy-check pattern applied to internal/codesignalcli/tsanalyzerasset/ instead of go.mod/go.sum"
depends = ["ts-analyzer-embed-sync"]
# sync-ts-analyzer-embed.mjs deletes and recreates the whole destination, so
# a module added to the js/semantics build output lands as an untracked
# file, not a tracked diff -- `git diff --exit-code` alone (the naive
# go.mod/go.sum-style check) would miss it silently. `--intent-to-add`
# stages new paths (without their content) so `git diff` reports them too;
# it deliberately does not `git add` (which would stage content and could
# mask this task with a dirty index on a later run).
run = """
git add --intent-to-add -- internal/codesignalcli/tsanalyzerasset
git diff --exit-code -- internal/codesignalcli/tsanalyzerasset
"""

[tasks.js-ci]
description = "All JS-side verifications"
depends = ["js-test", "workflow-test", "opencode-plugin-test", "ts-analyzer-embed-stale-check"]

[tasks.wasm-build]
description = "Prove pkg/semantics compiles for GOOS=js GOARCH=wasm via the pure-Go gotreesitter engine (no TinyGo)"
run = "GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -tags 'grammar_subset grammar_subset_go grammar_subset_typescript grammar_subset_tsx' ./pkg/semantics/..."

[tasks.platform-up]
description = "Build and start the local platform compose stack (core profile: api + worker + postgres + redis + model stub); wait until coach-api is healthy"
run = [
  # secrets/ is bind-mounted at /secrets; ensure the host dir exists (PEM optional until Path C).
  "mkdir -p secrets",
  "docker compose --profile core up -d --build",
  # Wait for API: unauthenticated /v1/me returns 401 once the process is up.
  """
  set -e
  echo "platform-up: waiting for coach-api on :8080..."
  for i in $(seq 1 90); do
    code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/me || true)
    if [ "$code" = "401" ] || [ "$code" = "200" ]; then
      echo "platform-up: coach-api ready (HTTP $code)"
      exit 0
    fi
    sleep 2
  done
  echo "platform-up: timed out waiting for coach-api" >&2
  docker compose --profile core ps >&2 || true
  docker compose --profile core logs --tail=80 >&2 || true
  exit 1
  """,
]

[tasks.platform-down]
description = "Stop the local platform compose stack (core + llm profiles)"
run = "docker compose --profile core --profile llm down --remove-orphans"

[tasks.platform-stop]
description = "Alias for platform-down"
run = [{ task = "platform-down" }]

[tasks.platform-smoke]
description = "Ambient-credential guard + end-to-end platform smoke (mint → repo_baseline_scan → provenance report) against a running core stack"
run = [
  "go run ./cmd/acceptance-guard-preflight",
  "go run ./cmd/platform-smoke",
]

[tasks.platform-llm-validate]
description = "Operator-only reminder for llm-profile validation against a host OpenAI-compat model (Ollama/llama.cpp) via Envoy AI Gateway (does not download weights; not a CI gate)"
run = """
set -e
echo "platform-llm-validate (operator-only, not CI)"
echo ""
echo "Pilot path: docs/pilot-local-quickstart.md (Path B)"
echo "Operator env detail: docs/development/local-platform.md"
echo "Config: copy .env.example → .env (Compose loads .env automatically)"
echo ""
echo "1. Start a host OpenAI-compat /v1/chat/completions server, e.g.:"
echo "   - Ollama: ollama pull qwen3.5:4b  (or qwen3.5:4b-mlx) on :11434"
echo "   - llama.cpp Metal: listen on 127.0.0.1:8081"
echo "2. cp .env.example .env  # if needed"
echo "   Set in .env: AIGW_OPENAI_BASE_URL=http://host.docker.internal:<port>/v1"
echo "               MODEL_GATEWAY_MODEL=<served id>   # e.g. qwen3.5:4b"
echo "   (worker still calls ai-gateway:1975; aigw proxies upstream)"
echo "3. mkdir -p secrets && docker compose --profile llm up -d --build"
echo "4. mise run platform-smoke"
echo "5. Confirm report has ≥1 source=agent judgment from the host model"
echo ""
echo "Linux fallback: model container on the compose network; set AIGW_OPENAI_BASE_URL in .env to that service."
"""

# Atomic Go slice matching the verify job's steps. The sidecar suite still
# skips inside `test` unless Node and the sidecar binary are already present
# (verify installs only Go; local `ci-all` / `ci-fast` build the sidecar first).
[tasks.ci-go]
description = "Go slice matching the verify job: gofmt/vet/tidy/style/test/examples"
run = [
  { task = "gofmt" },
  { task = "go-vet" },
  { task = "tidy-check" },
  { task = "acceptance-style-check" },
  { task = "test" },
  { task = "test-examples" },
]

[tasks.ci]
description = "Run all CI verifications"
run = [
  { task = "ci-go" },
  { task = "js-ci" },
]

# `ci` runs `test` before anything builds the sidecar, so pkg/projectmodel's
# TypeScript sidecar acceptance suite skips unless Node and the binary are
# already present. `ci-fast` and `ci-all` put the sidecar first; the GHA
# `projectmodel-sidecar` job runs `projectmodel-sidecar-acceptance` in
# parallel with `js-verify` so that suite is never a silent skip in CI.
[tasks.ci-fast]
description = "Per-cycle validation for the implement/review loop: Go slice with the TS sidecar built first, plus the agent-tooling suites (no silent skips)"
run = [
  { task = "gofmt" },
  { task = "go-vet" },
  { task = "acceptance-style-check" },
  { task = "project-sidecar-build" },
  { task = "test" },
  # Pure-Node and sub-second, covering the agent-tooling files most likely to
  # be edited inside this loop -- without them the fastest feedback on a broken
  # workflow script or a non-portable command is the full gate.
  { task = "workflow-test" },
  { task = "opencode-plugin-test" },
]

# Deliberately cheap: no test execution at all. The exhaustive gate is GHA +
# branch protection (required `status` check); this is the smoke signal in
# front of it -- the checks that cost seconds and account for most red PRs.
# A serial local ci-all measured ~910s on a CCR container, while GitHub Actions
# proves a strict superset (plus platform-smoke) in ~426s wall clock on compute
# that is not the session's.
#
# Do not add `test`, `ci-go`, `ci-fast` or `ci-all` here -- `test` is
# `go test -race ./...`, which with the sidecar built includes pkg/projectmodel,
# the exact cost this split removes. Do not add `tidy-check` either: it rewrites
# go.mod/go.sum in place, dirtying the tree mid-check. GHA runs both, as
# required checks.
[tasks.ci-gate]
description = "Fast local smoke: cheap static checks only; GHA + branch protection are the exhaustive gate"
run = [
  { task = "gofmt" },
  { task = "go-vet" },
  { task = "acceptance-style-check" },
]

# The single authoritative "everything CI proves" task. No longer the ship gate
# -- GHA runs these as parallel required jobs -- but still the way to prove the
# whole thing locally when you want to.
# Sidecar-first so `test` inside `ci-go` actually runs the projectmodel suite
# (no second invocation). Excludes test-acceptance-fast: its ambient-credential
# preflight refuses to run whenever GITHUB_TOKEN/GH_TOKEN or ~/.aws/config are
# present -- always true in Claude Code remote environments -- and it adds no
# coverage, since `test` is `go test -race ./...` unfiltered, a superset of
# -run Acceptance. Excludes platform-smoke: needs Docker and live services.
[tasks.ci-all]
description = "Everything CI proves except platform-smoke: sidecar-first Go slice + js-ci + wasm-build"
run = [
  { task = "project-sidecar-build" },
  { task = "ci-go" },
  { task = "js-ci" },
  { task = "wasm-build" },
]
